<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Vida de Advogado</title>
<meta name="description" content="Jogo de gestão e probabilidade: monte seu escritório de advocacia, negocie honorários, escolha as teses certas e evite as roubadas (e a cadeia)." />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0e1420" />
<style>
  :root {
    --ink: #0e1420;
    --ink-2: #0b111b;
    --panel: #18212f;
    --panel-2: #1e293b;
    --line: #2a3646;
    --brass: #e3ae41;
    --brass-dim: #b98a2f;
    --parch: #ece4d3;
    --muted: #93a1b5;
    --muted-2: #6c7a90;
    --good: #43c78a;
    --bad: #e06666;
    --crime: #b088e0;
    --sky: #6fb7e8;
    --violet: #9d8be6;
    --rose: #e08aa0;
    --radius: 14px;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--parch);
    background:
      radial-gradient(1200px 600px at 50% -200px, #1a2434 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 100%, #14202f 0%, transparent 55%),
      var(--ink);
    min-height: 100dvh;
    line-height: 1.5;
  }
  .wrap { max-width: 620px; margin: 0 auto; padding: 0 14px 40px; }

  h1, h2, h3, .serif {
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
  }
  .tnum { font-variant-numeric: tabular-nums; }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: linear-gradient(180deg, rgba(14,20,32,.96), rgba(14,20,32,.86));
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(227,174,65,.22);
    padding: 12px 14px 11px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .topbar .brandwrap { max-width: 620px; margin: 0 auto; width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .seal {
    width: 34px; height: 34px; border-radius: 9px; flex: none;
    display: grid; place-items: center; font-size: 18px;
    background: radial-gradient(circle at 30% 25%, #3a2f16, #1a1608);
    border: 1px solid var(--brass-dim);
    box-shadow: inset 0 1px 0 rgba(227,174,65,.35);
  }
  .brand h1 { font-size: 18px; margin: 0; letter-spacing: .3px; color: var(--parch); }
  .brand .sub { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
  .ghostbtn {
    font: inherit; font-size: 11.5px; font-weight: 600;
    color: var(--muted); background: transparent;
    border: 1px solid var(--line); border-radius: 9px;
    padding: 6px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
  }
  .ghostbtn:hover { color: var(--parch); border-color: var(--brass-dim); }

  /* ---------- Status panel ---------- */
  .panel {
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    margin-top: 14px;
    box-shadow: 0 10px 30px -18px rgba(0,0,0,.8);
  }
  .statgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (min-width: 460px) { .statgrid { grid-template-columns: repeat(4, 1fr); } }
  .stat { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .stat .ic { color: var(--brass); flex: none; font-size: 15px; width: 18px; text-align: center; }
  .stat .lbl { font-size: 9.5px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted-2); font-weight: 700; }
  .stat .val { font-size: 15px; font-weight: 700; color: var(--parch); }
  .stat .val.neg { color: var(--bad); }
  .stat .vsub { font-size: 10px; color: var(--muted-2); }
  .pips { display: flex; gap: 4px; margin-top: 3px; }
  .pip { width: 10px; height: 10px; border-radius: 50%; background: #313d4f; }
  .pip.on { background: var(--brass); box-shadow: 0 0 6px rgba(227,174,65,.6); }

  .attrs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 14px; padding-top: 13px; border-top: 1px solid var(--line); }
  .attr .row { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--muted); margin-bottom: 5px; }
  .attr .row b { color: var(--parch); font-size: 12px; }
  .bar { height: 6px; border-radius: 99px; background: #2a3646; overflow: hidden; }
  .bar > span { display: block; height: 100%; border-radius: 99px; transition: width .35s ease; }

  /* ---------- Tabs ---------- */
  .tabs { display: flex; gap: 4px; background: #131c29; border: 1px solid var(--line); padding: 4px; border-radius: 12px; margin-top: 14px; }
  .tab { flex: 1; position: relative; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; font-weight: 700; padding: 8px 4px; border-radius: 9px; cursor: pointer; }
  .tab.active { background: linear-gradient(180deg, #26344a, #1d2839); color: var(--parch); box-shadow: inset 0 1px 0 rgba(255,255,255,.05); }
  .tab .dot { position: absolute; top: 5px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--crime); box-shadow: 0 0 7px var(--crime); }

  /* ---------- Sections & cards ---------- */
  section { margin-top: 18px; }
  .sechead { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; color: var(--parch); margin: 0 0 9px; letter-spacing: .3px; }
  .sechead .count { font-family: system-ui; font-weight: 600; color: var(--muted-2); font-size: 11.5px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 13px; }
  .card + .card { margin-top: 9px; }
  .empty { border: 1px dashed #33425a; border-radius: var(--radius); background: rgba(255,255,255,.015); color: var(--muted); font-size: 13px; text-align: center; padding: 18px; }

  .casehead { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .casetitle { font-weight: 700; font-size: 14px; color: var(--parch); display: flex; align-items: center; gap: 7px; }
  .casesub { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .chip { font-size: 10px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; padding: 2px 7px; border-radius: 6px; background: rgba(227,174,65,.12); color: var(--brass); border: 1px solid rgba(227,174,65,.25); }
  .value { text-align: right; }
  .value .v { font-size: 14px; font-weight: 800; color: var(--parch); }
  .dots { margin-top: 2px; letter-spacing: 1px; font-size: 9px; }
  .dots .f { color: var(--brass); } .dots .e { color: #38455a; }
  .resumo { font-size: 12.5px; color: #c3cede; margin: 9px 0 0; }
  .limit { font-size: 11px; color: var(--brass); margin-top: 4px; }

  .read { margin-top: 9px; border-radius: 10px; padding: 9px 10px; font-size: 12px; }
  .read.info { background: rgba(111,183,232,.1); border: 1px solid rgba(111,183,232,.25); color: #bfe0f5; }
  .read.warn { background: rgba(224,102,102,.12); border: 1px solid rgba(224,102,102,.3); color: #f2b9b9; }
  .read b { color: #fff; }

  .actions { display: flex; gap: 8px; margin-top: 11px; flex-wrap: wrap; }
  button.btn { font: inherit; font-weight: 700; font-size: 12.5px; border-radius: 10px; padding: 9px 12px; cursor: pointer; border: 1px solid transparent; transition: transform .05s, filter .15s; }
  button.btn:active { transform: scale(.97); }
  button.btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.gold { background: linear-gradient(180deg, #eab84f, #c9922e); color: #241a06; box-shadow: 0 6px 16px -8px rgba(227,174,65,.7); flex: 1; }
  .btn.gold:hover:not(:disabled) { filter: brightness(1.06); }
  .btn.ghost { background: transparent; color: var(--muted); border-color: var(--line); }
  .btn.ghost:hover:not(:disabled) { color: var(--parch); border-color: var(--brass-dim); }
  .btn.dark { background: #0f1826; color: var(--parch); border-color: var(--line); width: 100%; }
  .btn.dark:hover:not(:disabled) { border-color: var(--brass-dim); }
  .btn.danger { background: linear-gradient(180deg, #d75c5c, #b23e3e); color: #fff; flex: 1; }
  .btn.danger-ghost { background: transparent; color: var(--bad); border-color: rgba(224,102,102,.4); flex: 1; }

  .endday { width: 100%; margin-top: 8px; background: linear-gradient(180deg, #202c3e, #141d2b); color: var(--parch); border: 1px solid var(--line); border-radius: var(--radius); padding: 13px; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer; }
  .endday:hover { border-color: var(--brass-dim); }
  .endday .c { color: var(--muted); font-weight: 600; font-size: 12px; }

  /* ---------- Evoluir ---------- */
  .grid2 { display: grid; grid-template-columns: 1fr; gap: 9px; }
  @media (min-width: 460px) { .grid2 { grid-template-columns: 1fr 1fr; } }
  .mini-title { font-weight: 700; font-size: 13px; color: var(--parch); }
  .mini-desc { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
  .cur { color: var(--brass); }

  /* ---------- Crime ---------- */
  .crime { background: linear-gradient(180deg, #2a1622, #1c1119); border: 1px solid rgba(176,136,224,.35); border-radius: var(--radius); padding: 15px; }
  .crime .ct { display: flex; align-items: center; gap: 8px; font-weight: 800; color: #e8d3f5; font-size: 14px; font-family: Georgia, serif; }
  .crime .cd { font-size: 13px; color: #d5c2df; margin: 9px 0; }
  .crime .box { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 11px 0; }
  .crime .box > div { background: rgba(0,0,0,.28); border-radius: 9px; padding: 8px 10px; }
  .crime .box .k { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .crime .box .p { font-weight: 800; font-size: 13px; margin-top: 2px; }
  .crime .warnline { font-size: 11px; color: #cbb0d8; margin-bottom: 11px; }

  /* ---------- Feed ---------- */
  .feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .feed li { font-size: 12px; border-radius: 9px; padding: 8px 11px; border: 1px solid transparent; }
  .feed .d { color: var(--muted-2); font-weight: 700; }
  .fe-bom { background: rgba(67,199,138,.1); color: #b3ecd0; border-color: rgba(67,199,138,.2); }
  .fe-ruim { background: rgba(224,102,102,.1); color: #f0c0c0; border-color: rgba(224,102,102,.2); }
  .fe-crime { background: rgba(176,136,224,.12); color: #e2ccf3; border-color: rgba(176,136,224,.22); }
  .fe-neutro { background: rgba(255,255,255,.03); color: var(--muted); border-color: var(--line); }

  /* ---------- Jail banner ---------- */
  .jail { display: flex; gap: 11px; align-items: center; background: rgba(224,102,102,.1); border: 1px solid rgba(224,102,102,.3); border-radius: var(--radius); padding: 13px; margin-top: 16px; color: #f2c4c4; font-size: 12.5px; }
  .jail .big { font-size: 22px; }
  .jail b { color: #fff; display: block; margin-bottom: 2px; font-size: 13.5px; }

  /* ---------- Modal ---------- */
  .overlay { position: fixed; inset: 0; z-index: 50; background: rgba(4,7,12,.66); backdrop-filter: blur(3px); display: flex; align-items: flex-end; justify-content: center; }
  @media (min-width: 560px) { .overlay { align-items: center; padding: 16px; } }
  .modal { width: 100%; max-width: 460px; max-height: 92dvh; overflow-y: auto; background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid var(--line); border-radius: 18px 18px 0 0; padding: 18px; box-shadow: 0 -20px 60px -20px rgba(0,0,0,.9); }
  @media (min-width: 560px) { .modal { border-radius: 18px; } }
  .modal h3 { margin: 0; font-size: 17px; color: var(--parch); }
  .modal .msub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .faixas { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
  .faixa { text-align: left; border: 1px solid var(--line); background: #131c29; border-radius: 12px; padding: 10px; cursor: pointer; }
  .faixa.sel { border-color: var(--brass); background: rgba(227,174,65,.1); box-shadow: 0 0 0 1px var(--brass) inset; }
  .faixa .fn { font-weight: 800; font-size: 13.5px; color: var(--parch); }
  .faixa .fh { font-size: 10.5px; color: var(--muted); }
  .faixa .fv { margin-top: 5px; font-weight: 800; color: var(--brass); font-size: 14px; }
  .summary { margin-top: 13px; background: #101a27; border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: 13px; }
  .summary .r { display: flex; justify-content: space-between; padding: 2px 0; }
  .summary .r span { color: var(--muted); } .summary .r b { color: var(--parch); }
  .prob { margin-top: 8px; }
  .prob .r { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; }
  .thesis { display: flex; flex-direction: column; gap: 7px; margin-top: 10px; }
  .thesis button { display: flex; gap: 9px; align-items: flex-start; text-align: left; border: 1px solid var(--line); background: #131c29; border-radius: 11px; padding: 10px; cursor: pointer; font: inherit; font-size: 12.5px; color: #cbd5e4; }
  .thesis button.sel { border-color: var(--brass); background: rgba(227,174,65,.09); color: var(--parch); }
  .checkbox { width: 18px; height: 18px; flex: none; border-radius: 5px; border: 1px solid #48566b; display: grid; place-items: center; font-size: 12px; color: transparent; margin-top: 1px; }
  .thesis button.sel .checkbox { background: var(--brass); border-color: var(--brass); color: #241a06; }
  .modal-actions { display: flex; gap: 9px; margin-top: 16px; }

  /* ---------- Toast ---------- */
  .toast-wrap { position: fixed; left: 0; right: 0; bottom: 18px; z-index: 60; display: flex; justify-content: center; pointer-events: none; padding: 0 14px; }
  .toast { max-width: 560px; width: 100%; background: #1c2636; border: 1px solid var(--brass-dim); border-radius: 12px; padding: 11px 14px; font-size: 12.5px; color: var(--parch); box-shadow: 0 14px 40px -12px rgba(0,0,0,.9); transform: translateY(140%); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
  .toast.show { transform: translateY(0); }
  .toast.bom { border-color: rgba(67,199,138,.6); }
  .toast.ruim { border-color: rgba(224,102,102,.6); }
  .toast.crime { border-color: rgba(176,136,224,.6); }

  /* ---------- Game over ---------- */
  .gameover { position: fixed; inset: 0; z-index: 70; background: rgba(4,7,12,.85); display: grid; place-items: center; padding: 20px; }
  .gameover .box { max-width: 360px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 18px; padding: 26px; text-align: center; }
  .gameover .box .sk { font-size: 42px; }
  .gameover h2 { margin: 8px 0 6px; color: var(--parch); }
  .gameover p { color: var(--muted); font-size: 13px; margin: 0 0 18px; }

  /* ---------- Arte / ilustrações ---------- */
  .identity { display: flex; align-items: center; gap: 12px; padding-bottom: 13px; margin-bottom: 13px; border-bottom: 1px solid var(--line); }
  .portrait { width: 62px; height: 68px; border-radius: 12px; overflow: hidden; flex: none; border: 1px solid var(--brass-dim); box-shadow: inset 0 1px 0 rgba(227,174,65,.3), 0 8px 18px -12px #000; }
  .portrait svg { display: block; width: 100%; height: 100%; }
  .identity .who { min-width: 0; }
  .identity .role { font-family: Georgia, serif; font-size: 15px; font-weight: 700; color: var(--parch); }
  .identity .place { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
  .identity .place b { color: var(--brass); font-weight: 600; }
  .thumbwrap { position: relative; flex: none; width: 46px; height: 46px; }
  .thumb { width: 46px; height: 46px; border-radius: 11px; overflow: hidden; border: 1px solid var(--line); }
  .thumb svg { display: block; width: 100%; height: 100%; }
  .abadge { position: absolute; right: -5px; bottom: -5px; width: 22px; height: 22px; border-radius: 7px; overflow: hidden; border: 2px solid var(--panel); box-shadow: 0 2px 6px rgba(0,0,0,.5); }
  .abadge svg { display: block; width: 100%; height: 100%; }
  .lead { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .interns { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  .intern { width: 40px; height: 40px; border-radius: 9px; overflow: hidden; border: 1px solid var(--line); }
  .intern svg { display: block; width: 100%; height: 100%; }
  .intern.slotvazio { border-style: dashed; opacity: 0.4; display: grid; place-items: center; color: var(--muted-2); font-size: 18px; }
  .crime-art { width: 100%; height: 116px; border-radius: 12px; overflow: hidden; margin-bottom: 13px; border: 1px solid rgba(176,136,224,.3); }
  .crime-art svg { display: block; width: 100%; height: 100%; }
  .jail-art { width: 50px; height: 50px; flex: none; border-radius: 10px; overflow: hidden; border: 1px solid rgba(224,102,102,.35); }
  .jail-art svg { display: block; width: 100%; height: 100%; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  button:focus-visible, .tab:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brandwrap">
    <div class="brand">
      <div class="seal">⚖️</div>
      <div>
        <h1>Vida de Advogado</h1>
        <div class="sub" id="topsub">Dia 1</div>
      </div>
    </div>
    <button class="ghostbtn" data-act="reiniciar">↺ Recomeçar</button>
  </div>
</div>

<div class="wrap">
  <div id="app"></div>
</div>

<div class="toast-wrap"><div class="toast" id="toast"></div></div>

<script>
(function () {
  "use strict";

  // ================================================================
  // CONTEÚDO
  // ================================================================
  var ROTULO_AREA = { trabalhista:"Trabalhista", civel:"Cível", consumidor:"Consumidor", familia:"Família", criminal:"Criminal", empresarial:"Empresarial" };
  var EMOJI_AREA = { trabalhista:"👷", civel:"⚖️", consumidor:"🛒", familia:"👨‍👩‍👧", criminal:"🚔", empresarial:"🏢" };

  var ARQUETIPOS = [
    // ===== TIER 1 — começo de carreira (causas locais) =====
    { area:"trabalhista", tier:1, titulo:"Horas extras no comércio local", complexidade:2, valorBase:4500,
      resumo:"Balconista de mercadinho fez hora extra todo dia por 2 anos, sem registro nem pagamento. Colegas confirmam e há fotos do ponto.",
      sinal:"Prova testemunhal e indícios da jornada — pedido consistente.",
      teses:[ [1,"Horas extras com adicional de 50% e reflexos em férias, 13º e FGTS"], [1,"Prova da jornada por testemunhas e registros informais"], [1,"Intervalo intrajornada não usufruído (art. 71 CLT)"], [0,"Pedir estabilidade decenal já revogada há décadas"], [0,"Dano moral por mero descumprimento contratual"] ] },
    { area:"trabalhista", tier:1, titulo:"Verbas rescisórias não pagas", complexidade:1, valorBase:3500,

      sinal:"Verbas incontroversas não pagas — caminho direto.",
      teses:[ [1,"Saldo de salário, aviso prévio, férias + 1/3 e 13º proporcional"], [1,"Multa do art. 477 da CLT pelo atraso na quitação"], [1,"Liberação do FGTS + 40% e guias do seguro-desemprego"], [0,"Pedir reintegração sem qualquer estabilidade"], [0,"Reconhecer justa causa do próprio empregado"] ] },
    { area:"consumidor", tier:1, titulo:"Produto com vício não resolvido", complexidade:1, valorBase:3000,
      resumo:"Celular novo apresentou defeito, foi 3 vezes à assistência em 30 dias e não foi resolvido. Cliente tem as ordens de serviço.",
      sinal:"Prazo de 30 dias esgotado sem solução, com ordens de serviço.",
      teses:[ [1,"Opções do art. 18 do CDC (troca, abatimento ou restituição)"], [1,"Responsabilidade solidária de fabricante e loja"], [1,"Dano moral pelo desgaste e privação prolongada do bem"], [0,"Rescindir todo o contrato de telefonia da operadora por tabela"], [0,"Pedir a prisão do gerente da loja"] ] },
    { area:"consumidor", tier:1, titulo:"Voo cancelado sem assistência", complexidade:2, valorBase:4200,
      resumo:"Companhia cancelou o voo e deixou o cliente 14h no aeroporto sem hotel nem alimentação. Ele tem os comprovantes de gastos.",
      sinal:"Falha clara na prestação do serviço, com comprovantes.",
      teses:[ [1,"Responsabilidade objetiva do fornecedor (art. 14 CDC)"], [1,"Dano moral pela falha e pelo descaso na assistência"], [1,"Danos materiais com base nos comprovantes de gastos"], [0,"Invocar a Convenção de Montreal para limitar a própria indenização"], [0,"Pedir a cassação da concessão da companhia aérea"] ] },
    { area:"consumidor", tier:1, titulo:"Cobrança indevida na conta", complexidade:1, valorBase:2800,
      resumo:"O banco debitou por meses tarifas e um 'seguro' que o cliente nunca contratou.",
      sinal:"Débitos sem contratação — devolução em dobro cabível.",
      teses:[ [1,"Declaração de inexistência do débito e fim da cobrança"], [1,"Repetição do indébito em dobro (art. 42, § único, CDC)"], [1,"Inversão do ônus da prova quanto à contratação"], [0,"Quebra do sigilo bancário de todos os correntistas do banco"], [0,"Prisão do gerente por estelionato na ação cível"] ] },
    { area:"civel", tier:1, titulo:"Acidente de trânsito leve", complexidade:2, valorBase:4000,

  // ================================================================
  // UTIL
  // ================================================================
  function chance(p){ return Math.random() < p; }
  function clamp(v,mn,mx){ if(mn===undefined)mn=0; if(mx===undefined)mx=100; return Math.max(mn, Math.min(mx, v)); }
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
  function embaralhar(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function uid(){ return Math.random().toString(36).slice(2,10); }
  function jitter(base,pct){ pct=pct===undefined?0.25:pct; var f=1+(Math.random()*2-1)*pct; return Math.round(base*f/10)*10; }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  function brl(v){ return v.toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0}); }
  function brlCurto(v){ var a=Math.abs(v); if(a>=1000) return (v<0?"-":"")+"R$ "+(a/1000).toFixed(a%1000===0?0:1)+"k"; return brl(v); }

  function estadoInicial(){
    var s = { versao:2, dia:1, dinheiro:2000, reputacao:8, carisma:15, tecnica:18, energia:4, energiaMax:4,
      nivel:1, xp:0, escritorioNivel:0, cidadeId:"interior", estagiarios:0, ofertas:[], ativos:[], crime:null,
      ultimosTitulos:[], ultimoCrime:"", preso:0, feed:[], vitorias:0, derrotas:0, encerrado:false };
    s.ofertas = gerarOfertas(s, 3);
    s.crime = chance(0.4) ? gerarCrime(s) : null;
    registrar(s, "Você abriu seu escritório. Boa sorte, doutor(a)! ⚖️", "neutro");
    return s;
  }
  function carregar(){ try{ var b=localStorage.getItem(CHAVE); if(!b) return null; var e=JSON.parse(b); if(e.versao!==2) return null; return e; }catch(_){ return null; } }
  function salvar(){ try{ localStorage.setItem(CHAVE, JSON.stringify(S)); }catch(_){} }

  function registrar(s, texto, tipo){ s.feed.unshift({ id:uid(), dia:s.dia, texto:texto, tipo:tipo }); if(s.feed.length>60) s.feed.length=60; }

  // ---------- Geração ----------
  function multQualidade(s){ var q=ESCRITORIOS[s.escritorioNivel].qualidade; var c=CIDADES.filter(function(x){return x.id===s.cidadeId;})[0]; return q*(c?c.qualidade:1); }
  function indiceCidade(s){ var i=0; CIDADES.forEach(function(c,k){ if(c.id===s.cidadeId) i=k; }); return i; }
  // Faixa de "tier" liberada pela evolução (escritório + cidade).
  function faixaTier(s){ var nm=s.escritorioNivel+indiceCidade(s); var max = nm>=4?3 : nm>=2?2 : 1; var min = max===3?2:1; return {min:min, max:max}; }
  function ofertaDe(a, buxa, mult){
    return { id:uid(), cliente:pick(NOMES), area:a.area, titulo:a.titulo, resumo:a.resumo, complexidade:a.complexidade,
      valorBase:Math.max(400, jitter(a.valorBase*mult)), buxa:buxa, sinal:a.sinal,
      aceitaEntrada: !buxa || chance(0.15),
      // Embaralha as teses para a ordem não entregar as certas.
      teses:embaralhar(a.teses.map(function(t){ return { id:uid(), texto:t[1], correta: t[0]===1 }; })), analisado:false };
  }
  function gerarOfertas(s, n){
    var m=multQualidade(s), ft=faixaTier(s);
    var reais = ARQUETIPOS.filter(function(a){ return a.tier>=ft.min && a.tier<=ft.max; });
    var evitar = {}; (s.ultimosTitulos||[]).forEach(function(t){ evitar[t]=1; });
    var usados = {}, out=[];
    for(var i=0;i<n;i++){
      var buxa=chance(0.28), arq;
      if(buxa){
        var bx = ARQUETIPOS_BUXA.filter(function(a){ return a.tier<=ft.max && !usados[a.titulo]; });
        arq = pick(bx.length?bx:ARQUETIPOS_BUXA);
      } else {
        var cand = reais.filter(function(a){ return !usados[a.titulo] && !evitar[a.titulo]; });
        if(cand.length===0) cand = reais.filter(function(a){ return !usados[a.titulo]; });
        if(cand.length===0) cand = reais;
        arq = pick(cand);
      }
      usados[arq.titulo]=1;
      out.push(ofertaDe(arq, buxa, m));
    }
    s.ultimosTitulos = out.map(function(o){ return o.titulo; });
    return out;
  }
  function gerarCrime(s){
    var ft=faixaTier(s);
    var pool = CRIMES.filter(function(c){ return c.tier<=ft.max && c.titulo!==s.ultimoCrime; });
    if(pool.length===0) pool = CRIMES.filter(function(c){ return c.tier<=ft.max; });
    if(pool.length===0) pool = CRIMES.slice();
    var c=pick(pool); s.ultimoCrime=c.titulo;
    return { id:uid(), titulo:c.titulo, descricao:c.descricao, ganho:jitter(c.ganho,0.2), chanceBase:c.chanceBase, penaDias:c.penaDias, multa:c.multa, perdaReputacao:c.perdaReputacao };
  }

  // ---------- Probabilidades ----------
  function honorarioDe(o, faixa){ return Math.round(o.valorBase*MULT_FAIXA[faixa]/10)*10; }
  function chanceAceite(s, o, faixa){
    var p = ACEITE_BASE[faixa]; p += (s.carisma/100)*0.25; p += (s.reputacao/100)*0.15; p -= (o.complexidade-2)*0.03; if(o.buxa) p += 0.2;
    return clamp(p, 0.05, 0.98);
  }
  function chanceVitoria(s, caso, tesesIds){
    var p = 0.32; var tecEf = clamp(s.tecnica + s.estagiarios*6);
    p += (tecEf/100)*0.28; p += (s.carisma/100)*0.08; p += (s.reputacao/100)*0.1; p -= (caso.complexidade-2)*0.05;
    var corretas = caso.teses.filter(function(t){return t.correta;}).length, acertos=0;
    tesesIds.forEach(function(id){ var t=caso.teses.filter(function(x){return x.id===id;})[0]; if(!t)return; if(t.correta){p+=0.13; acertos++;} else {p-=0.1;} });
    if(corretas>0) p -= (corretas-acertos)*0.04;
    if(caso.buxa) p = Math.min(p, 0.12);
    return clamp(p, 0.03, 0.97);
  }
  function leituraTecnica(s, o){
    var nitidez = clamp(s.tecnica + s.estagiarios*5)/100;
    var ideais = o.teses.filter(function(t){return t.correta;}).map(function(t){return t.id;});
    var real = chanceVitoria(s, o, ideais);
    var ruido = (Math.random()*2-1)*(1-nitidez)*0.35;
    return { chanceEstim: clamp(real+ruido, 0.02, 0.98), buxaRevelada: o.buxa && nitidez>0.35 };
  }
  function ganharXp(s, xp){ s.xp += xp; while(s.xp >= s.nivel*100){ s.xp -= s.nivel*100; s.nivel++; s.energiaMax++; } }

  function actAnalisar(id){
    if(S.energia<1){ flash("Sem energia para analisar. Encerre o dia.", "ruim"); return; }
    var o=S.ofertas.filter(function(x){return x.id===id;})[0]; if(!o)return;
    S.energia--; o.analisado=true; salvar(); render();

  function actRecusar(id){
    var o=S.ofertas.filter(function(x){return x.id===id;})[0];
    S.ofertas = S.ofertas.filter(function(x){return x.id!==id;});
    if(o && o.buxa){ registrar(S,'Você dispensou "'+o.titulo+'". Faro afiado — era roubada.',"bom"); S.reputacao=clamp(S.reputacao+1); }
    else if(o){ registrar(S,'Você recusou "'+o.titulo+'". O cliente procurou outro.',"neutro"); }
    after();
  }
  function actAceitar(id, faixa){
    var o=S.ofertas.filter(function(x){return x.id===id;})[0]; if(!o)return;
    if(S.energia<1){ flash("Sem energia para negociar. Encerre o dia.","ruim"); return; }
    var slots=ESCRITORIOS[S.escritorioNivel].slots;
    if(S.ativos.length>=slots){ flash("Sem vaga para novos casos. Resolva casos ou amplie o escritório.","ruim"); return; }
    var p=chanceAceite(S,o,faixa), hon=honorarioDe(o,faixa);
    S.energia--; S.ofertas=S.ofertas.filter(function(x){return x.id!==id;});
    if(!chance(p)){ registrar(S, o.cliente+" achou "+brlCurto(hon)+" caro e não fechou. 🙁", "ruim"); UI.modal=null; after(); return; }
    var entrada = o.aceitaEntrada ? Math.round(hon*0.25) : 0;
    var ativo = { id:o.id, cliente:o.cliente, area:o.area, titulo:o.titulo, resumo:o.resumo, complexidade:o.complexidade,
      valorBase:o.valorBase, buxa:o.buxa, sinal:o.sinal, aceitaEntrada:o.aceitaEntrada, teses:o.teses,
      honorario:hon, entrada:entrada, faixa:faixa, diaLimite:S.dia+6 };
    S.dinheiro += entrada; S.ativos.push(ativo); ganharXp(S,10);
    var txt = entrada>0 ? " Entrada de "+brlCurto(entrada)+" no caixa." : " Sem entrada (cuidado).";
    registrar(S, 'Fechou "'+o.titulo+'" por '+brlCurto(hon)+"."+txt, entrada>0?"bom":"neutro");
    UI.modal=null; after();
  }
  function actProtocolar(id, tesesIds){
    var c=S.ativos.filter(function(x){return x.id===id;})[0]; if(!c)return;
    if(S.energia<2){ flash("Protocolar exige 2 de energia. Encerre o dia.","ruim"); return; }
    var p=chanceVitoria(S,c,tesesIds), venceu=chance(p), restante=Math.max(0, c.honorario-c.entrada);
    S.energia-=2; S.ativos=S.ativos.filter(function(x){return x.id!==id;});
    if(venceu){
      S.dinheiro+=restante; S.reputacao=clamp(S.reputacao+3+Math.round(c.complexidade)); S.tecnica=clamp(S.tecnica+1); S.vitorias++;
      ganharXp(S, 25+c.complexidade*5);
      registrar(S, '🏆 Ganhou "'+c.titulo+'"! Recebeu '+brlCurto(restante)+" e ganhou reputação.", "bom");
    } else {
      S.reputacao=clamp(S.reputacao-(c.buxa?2:4)); S.derrotas++; ganharXp(S,6);
      var nota = c.buxa ? "Era um caso buxa — perdeu tempo e um pouco de reputação." : "Perdeu o caso. A reputação sofreu.";
      registrar(S, '❌ Perdeu "'+c.titulo+'". '+nota, "ruim");
    }
    UI.modal=null; after();
  }
  function actCrime(aceitar){
    if(!aceitar){ S.crime=null; registrar(S,"Você recusou a proposta suja. Ficha limpa.","neutro"); after(); return; }
    if(!S.crime) return;
    if(S.energia<2){ flash("Sem energia para essa 'empreitada'.","ruim"); return; }
    var c=S.crime, p=clamp(c.chanceBase + (S.tecnica/100)*0.15 - (S.reputacao/100)*0.1, 0.1, 0.9);
    S.energia-=2; S.crime=null;
    if(chance(p)){ S.dinheiro+=c.ganho; S.reputacao=clamp(S.reputacao-3); registrar(S,"🤫 Deu certo. "+brlCurto(c.ganho)+" no bolso, sem rastros... por enquanto.","crime"); }
    else { S.dinheiro-=c.multa; S.reputacao=clamp(S.reputacao-c.perdaReputacao); S.preso=c.penaDias; registrar(S,"🚔 Você foi pego! Multa de "+brlCurto(c.multa)+", "+c.penaDias+" dias preso e a reputação em frangalhos.","crime"); }
    after();
  }
  function actTreinar(idt){
    var t=TREINOS.filter(function(x){return x.id===idt;})[0]; if(!t)return;
    if(S.dinheiro<t.custo){ flash("Dinheiro insuficiente para esse treino.","ruim"); return; }
    if(S.energia<t.energia){ flash("Sem energia para treinar hoje.","ruim"); return; }
    S.dinheiro-=t.custo; S.energia-=t.energia; S[t.atributo]=clamp(S[t.atributo]+t.ganho);
    registrar(S,"📚 "+t.nome+": +"+t.ganho+" de "+t.atributo+".","bom"); after();
  }
  function actContratar(){
    var e=ESCRITORIOS[S.escritorioNivel];
    if(S.estagiarios>=e.maxEstagiarios){ flash("Seu escritório não comporta mais estagiários. Amplie primeiro.","ruim"); return; }
    if(S.dinheiro<CUSTO_ESTAGIARIO){ flash("Sem caixa para contratar agora.","ruim"); return; }
    S.dinheiro-=CUSTO_ESTAGIARIO; S.estagiarios++; registrar(S,"🧑‍🎓 Novo estagiário contratado. Mais técnica na equipe.","bom"); after();
  }
  function actDemitir(){ if(S.estagiarios<=0)return; S.estagiarios--; registrar(S,"Estagiário dispensado. Menos salário a pagar.","neutro"); after(); }
  function actUpgrade(){
    var prox=ESCRITORIOS[S.escritorioNivel+1]; if(!prox){ flash("Você já está no topo. 🏛️","neutro"); return; }
    if(S.dinheiro<prox.custoUpgrade){ flash("Falta caixa para essa mudança de sede.","ruim"); return; }
    S.dinheiro-=prox.custoUpgrade; S.escritorioNivel++; S.energiaMax+=prox.energiaBonus; S.reputacao=clamp(S.reputacao+5);
    registrar(S,"🏢 Novo escritório: "+prox.nome+"! Mais vagas, melhores casos.","bom"); after();
  }
  function actMudarCidade(cid){
    var c=CIDADES.filter(function(x){return x.id===cid;})[0]; if(!c||c.id===S.cidadeId)return;
    if(S.dinheiro<c.custoMudanca){ flash("Mudar de cidade custa mais do que você tem agora.","ruim"); return; }
    S.dinheiro-=c.custoMudanca; S.cidadeId=c.id; registrar(S,"📍 Escritório transferido para "+c.nome+". Novos horizontes.","bom"); after();
  }
  function actEncerrarDia(){
    var e=ESCRITORIOS[S.escritorioNivel];
    var custoFixo = e.aluguel + S.estagiarios*SALARIO_ESTAGIARIO;
    S.dinheiro -= custoFixo;
    var expirados = S.ativos.filter(function(c){ return c.diaLimite <= S.dia+1; });
    S.ativos = S.ativos.filter(function(c){ return c.diaLimite > S.dia+1; });
    var estavaPreso = S.preso>0;
    S.dia++; S.energia = S.energiaMax + e.energiaBonus;
    if(S.preso>0) S.preso--;
    if(S.preso<=0){ S.ofertas = gerarOfertas(S,3); S.crime = chance(0.35)?gerarCrime(S):null; }
    else { S.ofertas=[]; S.crime=null; }
    registrar(S, "— Dia "+S.dia+" — Custos do dia: "+brlCurto(custoFixo)+".", "neutro");
    expirados.forEach(function(c){ S.reputacao=clamp(S.reputacao-3); registrar(S,'⏰ "'+c.titulo+'" expirou sem protocolo. Cliente insatisfeito.',"ruim"); });
    if(estavaPreso && S.preso<=0) registrar(S,"🔓 Você saiu da prisão. Hora de reconstruir a carreira.","neutro");
    else if(S.preso>0) registrar(S,"🔒 Ainda preso: faltam "+S.preso+" dia(s).","ruim");
    if(S.dinheiro <= -3000){ S.encerrado=true; registrar(S,"💥 Falência! As dívidas te afundaram. Fim de jogo — reinicie para tentar de novo.","ruim"); }
    after();
  }

  // --- Rosto de cliente (paramétrico, estável por caso) ---

  function svgClient(seed){
    var h = hstr(seed);

    var style = (h>>>6) % 6;   // 0 curto,1 lado,2 careca,3 longo,4 coque,5 boné

    var p = '<svg viewBox="0 0 48 48" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">';

    // nariz

    p += '<path d="'+mm+'" stroke="'+s+'" stroke-width="1.8" fill="none" stroke-linecap="round"/>';

    html += '<div id="tabcontent">';
    if(UI.aba==="escritorio") html += tabEscritorio(e);
    else if(UI.aba==="evoluir") html += tabEvoluir(e);
    else if(UI.aba==="submundo") html += tabSubmundo();
    else html += tabRegistro();
    html += '</div>';
    app.innerHTML = html;

    renderModal();
    renderGameOver();
  }

  function statusPanel(e, cidade){
    var pipsMax = S.energiaMax + e.energiaBonus, pips="";
    for(var i=0;i<pipsMax;i++) pips += '<span class="pip'+(i<S.energia?" on":"")+'"></span>';
    return '<div class="panel">'
      + '<div class="identity"><div class="portrait">'+svgAvatar(S.escritorioNivel)+'</div>'
        + '<div class="who"><div class="role">'+ROTULO_ADV[Math.min(S.escritorioNivel, ROTULO_ADV.length-1)]+'</div>'
        + '<div class="place">'+esc(e.nome)+' · <b>'+esc(cidade.nome)+'</b></div></div></div>'
      + '<div class="statgrid">'
        + statItem("💰","Caixa", '<span class="'+(S.dinheiro<0?"neg":"")+'">'+brl(S.dinheiro)+"</span>", null, true)
        + '<div class="stat"><span class="ic">⚡</span><div><div class="lbl">Energia</div><div class="pips">'+pips+'</div></div></div>'
        + statItem("🏆","XP", S.xp+"/"+(S.nivel*100), "nível "+S.nivel, true)
        + statItem("⚖️","Placar", S.vitorias+"V / "+S.derrotas+"D", "casos julgados", true)
      + '</div>'
      + '<div class="attrs">'
        + attr("Reputação", S.reputacao, "var(--violet)")
        + attr("Carisma", S.carisma, "var(--rose)")
        + attr("Técnica", S.tecnica, "var(--sky)")
      + '</div></div>';
  }
  function statItem(ic, lbl, val, sub, tnum){
    return '<div class="stat"><span class="ic">'+ic+'</span><div style="min-width:0"><div class="lbl">'+lbl+'</div>'
      + '<div class="val '+(tnum?"tnum":"")+'">'+val+'</div>'+(sub?'<div class="vsub">'+sub+'</div>':"")+'</div></div>';
  }
  function attr(lbl, v, cor){
    return '<div class="attr"><div class="row"><span>'+lbl+'</span><b class="tnum">'+Math.round(v)+'</b></div><div class="bar">'+barColor(v,cor)+'</div></div>';
  }

  function tabsBar(){
    var temCrime = !!S.crime && S.preso<=0;
    var items = [["escritorio","Escritório",false],["evoluir","Evoluir",false],["submundo","Submundo",temCrime],["registro","Registro",false]];
    return '<div class="tabs">'+items.map(function(it){
      return '<button class="tab'+(UI.aba===it[0]?" active":"")+'" data-tab="'+it[0]+'">'+it[1]+(it[2]?'<span class="dot"></span>':"")+'</button>';
    }).join("")+'</div>';
  }

  function jailBanner(){
    return '<div class="jail"><div class="jail-art">'+svgJail()+'</div><div><b>Você está preso.</b>Faltam '+S.preso+' dia(s). Encerre os dias para cumprir a pena — os casos param enquanto isso.</div></div>';
  }

  // ---------- Escritório ----------
  function tabEscritorio(e){
    var h = '<section><div class="sechead">💼 Casos em andamento <span class="count">'+S.ativos.length+'/'+e.slots+'</span></div>';
    if(S.ativos.length===0) h += '<div class="empty">Nenhum caso em andamento. Aceite um caso abaixo.</div>';
    else h += S.ativos.map(cardAtivo).join("");
    h += '</section>';

    h += '<section><div class="sechead">✨ Novos casos na porta</div>';
    if(S.preso>0) h += '<div class="empty">Nada chega enquanto você está preso.</div>';
    else if(S.ofertas.length===0) h += '<div class="empty">Sem novos casos hoje. Encerre o dia para novas oportunidades.</div>';
    else h += S.ofertas.map(cardOferta).join("");
    h += '</section>';

    h += '<button class="endday" data-act="encerrar">🌙 Encerrar o dia '+S.dia+' <span class="c">· custo '+brlCurto(e.aluguel+S.estagiarios*SALARIO_ESTAGIARIO)+'</span></button>';
    return h;
  }
  function retrato(caso){
    return '<div class="thumbwrap"><div class="thumb">'+svgClient(caso.id+"|"+caso.cliente)+'</div><div class="abadge">'+svgArea(caso.area)+'</div></div>';
  }
  function cardAtivo(c){
    return '<div class="card"><div class="casehead"><div class="lead">'+retrato(c)+'<div style="min-width:0">'
      + '<div class="casetitle">'+esc(c.titulo)+'</div>'
      + '<div class="casesub">'+esc(c.cliente)+' · '+ROTULO_AREA[c.area]+' · honorário '+brlCurto(c.honorario)+'</div>'
      + '<div class="limit">Protocolar até o dia '+c.diaLimite+'</div></div></div>'
      + '<button class="btn gold" style="flex:none" data-work="'+c.id+'">Trabalhar</button></div></div>';
  }
  function cardOferta(o){
    var h = '<div class="card"><div class="casehead"><div class="lead">'+retrato(o)+'<div style="min-width:0">'
      + '<div class="casetitle">'+esc(o.titulo)+'</div>'
      + '<div class="casesub">'+esc(o.cliente)+' · '+ROTULO_AREA[o.area]+'</div></div></div>'
      + '<div class="value"><div class="v tnum">≈ '+brlCurto(o.valorBase)+'</div>'+dots(o.complexidade)+'</div></div>'
      + '<p class="resumo">'+esc(o.resumo)+'</p>';
    if(o.analisado){
      var l = leituraTecnica(S, o);
      if(l.buxaRevelada) h += '<div class="read warn"><b>⚠️ Caso buxa!</b> '+esc(o.sinal)+'</div>';
      else h += '<div class="read info">🔎 Leitura: chance estimada de vitória <b>'+Math.round(l.chanceEstim*100)+'%</b>. '+esc(o.sinal)+(o.aceitaEntrada?"":' <b>💸 Sem entrada.</b>')+'</div>';
    }
    h += '<div class="actions">';
    if(!o.analisado) h += '<button class="btn ghost" data-analisar="'+o.id+'">🔎 Analisar (1⚡)</button>';
    h += '<button class="btn gold" data-negociar="'+o.id+'">Negociar honorário</button>';
    h += '<button class="btn ghost" data-recusar="'+o.id+'">Recusar</button>';
    h += '</div></div>';
    return h;
  }

  // ---------- Evoluir ----------
  function tabEvoluir(e){
    var prox = ESCRITORIOS[S.escritorioNivel+1];
    var h = '<section><div class="sechead">📈 Treinar o personagem</div><div class="grid2">';
    h += TREINOS.map(function(t){
      var falta = S.dinheiro<t.custo || S.energia<t.energia;
      return '<div class="card"><div class="mini-title">'+esc(t.nome)+'</div><div class="mini-desc">'+esc(t.descricao)+'</div>'
        + '<button class="btn gold" style="margin-top:10px;width:100%" data-treinar="'+t.id+'"'+(falta?" disabled":"")+'>+'+t.ganho+' '+t.atributo+' · '+brlCurto(t.custo)+' · '+t.energia+'⚡</button></div>';
    }).join("");
    h += '</div></section>';

    h += '<section><div class="sechead">👥 Estagiários</div><div class="card">';
    h += '<div style="font-size:13px">Na equipe: <b class="cur">'+S.estagiarios+'</b> / '+e.maxEstagiarios+'</div>';
    h += '<div class="mini-desc">Cada estagiário reforça a técnica nos casos (custa R$ 40/dia de salário).</div>';
    if(e.maxEstagiarios>0){
      var eqs = '';
      for(var i=0;i<e.maxEstagiarios;i++) eqs += (i<S.estagiarios) ? '<div class="intern">'+svgIntern()+'</div>' : '<div class="intern slotvazio">+</div>';
      h += '<div class="interns">'+eqs+'</div>';
    }
    h += '<div class="actions"><button class="btn gold" data-act="contratar"'+((S.estagiarios>=e.maxEstagiarios||S.dinheiro<CUSTO_ESTAGIARIO)?" disabled":"")+'>Contratar · R$ 3k</button>';
    h += '<button class="btn ghost" data-act="demitir"'+(S.estagiarios<=0?" disabled":"")+'>Dispensar</button></div>';
    if(e.maxEstagiarios===0) h += '<div class="limit" style="margin-top:8px">Amplie o escritório para poder contratar.</div>';
    h += '</div></section>';

    h += '<section><div class="sechead">💼 Escritório</div><div class="card">';
    h += '<div class="mini-title">'+esc(e.nome)+'</div><div class="mini-desc">'+esc(e.descricao)+'</div>';
    h += '<div class="limit" style="color:var(--muted-2);margin-top:6px">Vagas de casos: '+e.slots+' · Aluguel '+brlCurto(e.aluguel)+'/dia</div>';
    if(prox) h += '<button class="btn dark" style="margin-top:10px" data-act="upgrade"'+(S.dinheiro<prox.custoUpgrade?" disabled":"")+'>Mudar para "'+esc(prox.nome)+'" · '+brl(prox.custoUpgrade)+'</button>';
    else h += '<div class="limit" style="color:var(--good);margin-top:8px">Você está no topo. 🏛️</div>';
    h += '</div></section>';

    h += '<section><div class="sechead">📍 Localidade</div>';
    h += CIDADES.map(function(c){
      var atual = c.id===S.cidadeId;
      var right = atual ? '' : '<button class="btn ghost" style="flex:none" data-cidade="'+c.id+'"'+(S.dinheiro<c.custoMudanca?" disabled":"")+'>'+(c.custoMudanca===0?"Ir":brlCurto(c.custoMudanca))+'</button>';
      return '<div class="card"'+(atual?' style="border-color:var(--brass-dim);background:rgba(227,174,65,.06)"':"")+'><div class="casehead">'
        + '<div><div class="mini-title">'+esc(c.nome)+(atual?' <span class="cur" style="font-size:11px">(atual)</span>':"")+'</div><div class="mini-desc">'+esc(c.descricao)+'</div></div>'+right+'</div></div>';
    }).join("");
    h += '</section>';
    return h;
  }

  // ---------- Submundo ----------
  function tabSubmundo(){
    if(S.preso>0) return '<div class="empty" style="margin-top:18px">Atrás das grades não há negócios. Cumpra a pena.</div>';
    if(!S.crime) return '<div class="empty" style="margin-top:18px">Ninguém do submundo apareceu hoje. Ufa. 😅</div>';
    var c=S.crime;
    return '<section><div class="crime">'
      + '<div class="crime-art">'+svgCrime()+'</div>'
      + '<div class="ct">💀 '+esc(c.titulo)+'</div>'
      + '<div class="cd">'+esc(c.descricao)+'</div>'
      + '<div class="box"><div><div class="k">Ganho</div><div class="p" style="color:var(--good)">'+brl(c.ganho)+'</div></div>'
      + '<div><div class="k">Se for pego</div><div class="p" style="color:var(--bad)">-'+brlCurto(c.multa)+' · '+c.penaDias+'d preso</div></div></div>'
      + '<div class="warnline">Reputação alta atrai olhares; técnica ajuda a não deixar rastro. Ao ser pego: multa, cadeia e reputação despencando.</div>'
      + '<div class="actions"><button class="btn danger" data-act="crime-sim">Topar (2⚡)</button>'
      + '<button class="btn danger-ghost" data-act="crime-nao">Recusar</button></div>'
      + '</div></section>';
  }

  // ---------- Registro ----------
  function tabRegistro(){
    if(S.feed.length===0) return '<div class="empty" style="margin-top:18px">Sem registros ainda.</div>';
    return '<section><ul class="feed">'+S.feed.map(function(f){
      return '<li class="fe-'+f.tipo+'"><span class="d">D'+f.dia+' · </span>'+esc(f.texto)+'</li>';
    }).join("")+'</ul></section>';
  }

  // ---------- Modais ----------
  function renderModal(){
    var old = document.getElementById("overlay"); if(old) old.remove();
    if(!UI.modal) return;
    var box = document.createElement("div");
    box.id="overlay"; box.className="overlay";
    if(UI.modal.tipo==="negociar") box.innerHTML = modalNegociar();
    else if(UI.modal.tipo==="protocolar") box.innerHTML = modalProtocolar();
    document.body.appendChild(box);
  }
  function modalNegociar(){
    var o = S.ofertas.filter(function(x){return x.id===UI.modal.id;})[0]; if(!o){ UI.modal=null; return ""; }
    var faixa = UI.modal.faixa || "justo";
    var hon = honorarioDe(o, faixa), aceite = chanceAceite(S, o, faixa);
    var faixasHtml = FAIXAS.map(function(f){
      return '<button class="faixa'+(faixa===f.id?" sel":"")+'" data-faixa="'+f.id+'"><div class="fn">'+f.nome+'</div><div class="fh">'+f.hint+'</div><div class="fv tnum">'+brl(honorarioDe(o,f.id))+'</div></button>';
    }).join("");
    return '<div class="modal"><div style="display:flex;gap:12px;align-items:center;margin-bottom:8px"><div class="thumb" style="width:52px;height:52px;flex:none">'+svgClient(o.id+"|"+o.cliente)+'</div><div style="min-width:0"><h3 style="margin:0">Negociar honorário</h3><div class="msub">'+esc(o.cliente)+' · '+esc(o.titulo)+'</div></div></div>'
      + '<div class="faixas">'+faixasHtml+'</div>'
      + '<div class="summary"><div class="r"><span>Honorário</span><b class="tnum">'+brl(hon)+'</b></div>'
      + '<div class="r"><span>Entrada (se fechar)</span><b class="tnum">'+(o.aceitaEntrada?brl(Math.round(hon*0.25)):"recusada 💸")+'</b></div>'
      + '<div class="prob"><div class="r"><span>Chance do cliente aceitar</span><b class="tnum">'+Math.round(aceite*100)+'%</b></div>'+probBar(aceite)+'</div></div>'
      + '<div class="modal-actions"><button class="btn ghost" style="flex:1" data-act="fechar-modal">Cancelar</button>'
      + '<button class="btn gold" data-confirmar-negociar="'+o.id+'"'+(S.energia<1?" disabled":"")+'>Propor (1⚡)</button></div></div>';
  }
  function modalProtocolar(){
    var c = S.ativos.filter(function(x){return x.id===UI.modal.id;})[0]; if(!c){ UI.modal=null; return ""; }
    var sel = UI.modal.sel || [];
    var teseHtml = c.teses.map(function(t){
      var on = sel.indexOf(t.id)>=0;
      return '<button class="'+(on?"sel":"")+'" data-tese="'+t.id+'"><span class="checkbox">✓</span><span>'+esc(t.texto)+'</span></button>';
    }).join("");
    return '<div class="modal"><div style="display:flex;gap:12px;align-items:center;margin-bottom:8px"><div class="thumb" style="width:52px;height:52px;flex:none">'+svgClient(c.id+"|"+c.cliente)+'</div><div style="min-width:0"><h3 style="margin:0">Montar a tese</h3><div class="msub">'+esc(c.titulo)+' · '+esc(c.cliente)+'</div></div></div>'
      + '<p class="resumo" style="margin-top:8px">'+esc(c.resumo)+'</p>'
      + '<div style="font-size:12px;font-weight:700;color:var(--muted);margin-top:12px">Escolha as teses que você vai sustentar:</div>'
      + '<div class="thesis">'+teseHtml+'</div>'
      + '<div class="summary"><div class="r"><span>Teses selecionadas</span><b class="tnum">'+sel.length+'</b></div>'
      + '<div class="mini-desc" style="margin-top:7px">Você <b>não</b> verá a chance antes de protocolar — confie na sua leitura do caso. Teses coerentes vencem; teses equivocadas afundam o processo. Técnica e reputação também pesam.</div></div>'
      + '<div class="modal-actions"><button class="btn ghost" style="flex:1" data-act="fechar-modal">Voltar</button>'
      + '<button class="btn gold" data-confirmar-protocolar="'+c.id+'"'+((S.energia<2||sel.length===0)?" disabled":"")+'>Protocolar (2⚡)</button></div></div>';
  }

  function renderGameOver(){
    var old=document.getElementById("gameover"); if(old) old.remove();
    if(!S.encerrado) return;
    var d=document.createElement("div"); d.id="gameover"; d.className="gameover";
    d.innerHTML = '<div class="box"><div class="sk">💀</div><h2>Fim de jogo</h2>'
      + '<p>As dívidas afundaram o escritório. Você chegou ao dia '+S.dia+' com '+S.vitorias+' vitórias e '+S.derrotas+' derrotas.</p>'
      + '<button class="btn gold" style="width:100%" data-act="reiniciar">Recomeçar</button></div>';
    document.body.appendChild(d);
  }

  // ================================================================
  // EVENTOS (delegação)
  // ================================================================
  document.addEventListener("click", function(ev){
    var t = ev.target.closest("[data-act],[data-tab],[data-analisar],[data-recusar],[data-negociar],[data-work],[data-treinar],[data-cidade],[data-faixa],[data-tese],[data-confirmar-negociar],[data-confirmar-protocolar]");
    if(!t) return;
    var a;
    if(t.dataset.tab){ UI.aba=t.dataset.tab; render(); return; }
    if((a=t.dataset.analisar)){ actAnalisar(a); return; }
    if((a=t.dataset.recusar)){ actRecusar(a); return; }
    if((a=t.dataset.negociar)){ UI.modal={tipo:"negociar", id:a, faixa:"justo"}; render(); return; }
    if((a=t.dataset.work)){ UI.modal={tipo:"protocolar", id:a, sel:[]}; render(); return; }
    if((a=t.dataset.treinar)){ actTreinar(a); return; }
    if((a=t.dataset.cidade)){ actMudarCidade(a); return; }
    if((a=t.dataset.faixa)){ UI.modal.faixa=a; render(); return; }
    if((a=t.dataset.tese)){ var s=UI.modal.sel; var i=s.indexOf(a); if(i>=0)s.splice(i,1); else s.push(a); render(); return; }
    if((a=t.dataset.confirmarNegociar)){ actAceitar(a, UI.modal.faixa||"justo"); return; }
    if((a=t.dataset.confirmarProtocolar)){ actProtocolar(a, UI.modal.sel||[]); return; }
    switch(t.dataset.act){
      case "reiniciar": actReiniciar(); break;
      case "encerrar": actEncerrarDia(); break;
      case "contratar": actContratar(); break;
      case "demitir": actDemitir(); break;
      case "upgrade": actUpgrade(); break;
      case "crime-sim": actCrime(true); break;
      case "crime-nao": actCrime(false); break;
      case "fechar-modal": UI.modal=null; render(); break;
    }
  });
  // Fecha modal ao tocar no fundo
  document.addEventListener("click", function(ev){
    if(ev.target.id==="overlay"){ UI.modal=null; render(); }
  });

  // ================================================================
  // BOOT
  // ================================================================
  app = document.getElementById("app");
  S = carregar() || estadoInicial();
  salvar();
  render();
})();
</script>

</body>
</html>
